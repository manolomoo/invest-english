<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>投資最重要的事｜學英文</title><link rel="stylesheet" href="style.css?v=3"></head><body><div class="w">
<header class="wk">
<div class="wk-top"><a class="nav" href="index.html">← 回首頁</a>
<h1 id="ttl">載入中…</h1><div class="en" id="ten"></div></div>
<nav class="jump" id="jump" aria-label="三步驟">
<div class="jump-bar">
<button type="button" class="on" data-sec="listen"><span class="sl">步驟一</span><b>盲聽 <i class="mk"></i></b></button>
<button type="button" data-sec="study"><span class="sl">步驟二</span><b>精讀 <i class="mk"></i></b></button>
<button type="button" data-sec="recall"><span class="sl">步驟三</span><b>回想 <i class="mk"></i></b></button>
</div>
</nav>
</header>
<div id="nov" style="display:none;color:var(--bad);font-size:14px">⚠️ 這個瀏覽器不支援音訊播放，請改用 Chrome／Safari／Edge。</div>
<div id="fin" class="box fin" hidden>🎉 三個步驟都完成了，這一課完成！<a class="nav" href="index.html">回首頁</a></div>

<section id="sec-listen" class="panel">
<div class="box" id="lpanel">
<b>步驟一　盲聽</b>
<div class="mu" style="font-size:15px;line-height:1.7">畫面不會顯示英文或中文。把整課從頭聽一遍，先用耳朵熟悉聲音與節奏。</div>
<div class="lpos" id="lpos">1 / 1</div>
<div class="pbar"><i id="lbar"></i></div>
<div class="cue" id="lcue" style="text-align:center"></div>
<div class="row" style="flex-wrap:nowrap"><button class="b" id="lpv" type="button">‹ 上一句</button><button class="b p" id="lpl" type="button">▶ 播放</button><button class="b" id="lnx" type="button">下一句 ›</button></div>
</div>
</section>

<section id="sec-study" class="panel" hidden>
<div class="box"><div class="row"><button class="b" id="zhall" type="button">全部顯示中文</button></div><div class="mu" id="snote" style="font-size:14px"></div></div>
<h2 class="sh">單字</h2>
<div class="box c bc"><div class="pos" id="pos"></div><div class="big" id="w"></div><div class="zhw" id="zh"></div><div class="ipa" id="ipa"></div><div class="tag" id="tag"></div><div class="def" id="def"></div><div class="ex" id="ex"></div><div class="cue" id="cue"></div></div>
<div class="row" style="flex-wrap:nowrap"><button class="b" id="o1" type="button">念單字</button><button class="b" id="o2" type="button">念例句</button></div>
<div class="row"><button class="b" id="pv" type="button">‹ 上一個</button><button class="b p" id="pl" type="button">▶ 回音法播放</button><button class="b" id="nx" type="button">下一個 ›</button></div>
<div class="mu">語速</div><div class="seg" id="rate"></div>
<div class="box srs"><b>單字複習（間隔重複）</b><div class="mu" id="srst" style="font-size:14px"></div>
<div class="row"><button class="b" id="sradd" type="button">＋ 加入複習</button></div>
<div class="row"><button class="b" id="srn" type="button">✘ 不記得</button><button class="b" id="srk" type="button">✔ 記得</button></div>
<div class="mu" style="font-size:13px">第一次按「記得／不記得」會自動加入複習，之後 1、3、7、14、30 天各複習一次。</div></div>
<div class="box"><b>單字卡</b><div class="mu" style="font-size:14px">點卡聽發音（單字→例句），並切換到這張卡練習。</div><div class="ga" id="ga"></div></div>
<div class="box" id="qz"></div>
<h2 class="sh">課文</h2>
<div class="box tx" id="tx"></div>
<h2 class="sh">文法</h2>
<div id="gram" style="display:flex;flex-direction:column;gap:14px"></div>
</section>

<section id="sec-recall" class="panel" hidden>
<div class="box"><b>步驟三　回想</b><div class="mu" style="font-size:15px;line-height:1.7">只看中文，先在心裡想出英文；再點「顯示英文對答案」，誠實自評記得或不記得。每一句都自評過就算完成。</div><div class="mu" id="rcsum" style="font-size:14px"></div><button class="b" id="rcreset" type="button">重新自評一遍</button></div>
<div id="rclist" style="display:flex;flex-direction:column;gap:12px"></div>
</section>
<div id="rw" class="box"></div>
</div>
