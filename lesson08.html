<script>
(function(){var D=window.WEEK;if(D){document.getElementById("ttl").textContent="第 "+D.n+" 課｜"+D.title;document.getElementById("ten").textContent=D.en+"　・　"+D.chapter}})();
</script>
<script src="unit.js?v=6"></script>
<script>
(function(){
  const nav=document.getElementById("jump"),ids=["v","t","g"];
  function show(id,scroll){
    ids.forEach(s=>{const el=document.getElementById("sec-"+s);if(el)el.hidden=s!==id});
    nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.sec===id));
    try{window.__stopAll?window.__stopAll():TTS.cancel()}catch(e){}
    if(scroll)window.scrollTo(0,0);
  }
  nav.addEventListener("click",e=>{const b=e.target.closest("button[data-sec]");if(!b)return;history.replaceState(null,"","#"+b.dataset.sec);show(b.dataset.sec,true)});
  window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(ids.includes(h))show(h,true)});
  const init=(location.hash||"").replace("#","");if(ids.includes(init))show(init,false);
})();
</script>
