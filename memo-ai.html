<style>
.mm-card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mm-card h2{margin:0;font-size:19px;line-height:1.4}
.mm-meta{font-size:14px;line-height:1.7;color:var(--mu)}.mm-meta a{color:var(--ac);overflow-wrap:anywhere}
.mm-p0{margin:0;font-size:17px;line-height:1.75}
.mm-q{border:1px solid var(--ln);border-radius:12px;background:var(--cd);min-width:0}
.mm-q summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;flex-direction:column;gap:2px;-webkit-tap-highlight-color:transparent}
.mm-q summary::-webkit-details-marker{display:none}
.mm-q .qn{font-size:13px;color:var(--ac);font-weight:700}.mm-q .qz{font-size:17px;font-weight:750;line-height:1.45}.mm-q .qe{font-size:13px;color:var(--mu);overflow-wrap:anywhere}
.mm-q .qb{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.7}
.mm-q[open] summary .qz::after{content:" ▴";color:var(--mu)}.mm-q:not([open]) summary .qz::after{content:" ▾";color:var(--mu)}
.mm-link{align-self:flex-start;border:0;background:transparent;color:var(--ac);font-size:15px;font-weight:650;padding:4px 0}
.mm-bar{display:flex;flex-direction:column;gap:8px}
.mm-bar .r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mm-bar label{font-size:15px;display:flex;align-items:center;gap:6px}
.mm-bar input[type=checkbox]{width:20px;height:20px}
.mm-bar .seg{flex:1 1 auto}.mm-bar .b{flex:0 0 auto;padding:9px 14px;font-size:15px}
.mm-seg{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;scroll-margin-top:60px}
.mm-seg.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset;background:var(--tint)}
.mm-sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mm-sh .b{flex:1 1 200px;padding:11px 8px;font-size:16px}
.mm-sh .t{font-size:13px;color:var(--mu);white-space:nowrap}
.mm-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.mm-en{font-size:20px;line-height:1.7;overflow-wrap:anywhere;margin:0}.mm-en b{font-weight:800}
.mm-b.h .mm-en{font-size:21px;font-weight:800;color:var(--ac);border-left:5px solid var(--ac);padding:4px 0 4px 10px;line-height:1.45;margin-top:4px}
.mm-zh{display:none;font-size:18px;line-height:1.7;color:var(--mu);margin:0 0 4px;overflow-wrap:anywhere}.mm-zh b{font-weight:700;color:var(--fg)}.showzh .mm-zh{display:block}
.mm-b.h .mm-zh{padding-left:15px}
.mm-note{font-size:15px;line-height:1.65;background:var(--tint);border-radius:10px;padding:8px 10px;margin:2px 0 6px;overflow-wrap:anywhere}
.mm-v{background:rgba(245,179,1,.22);border-bottom:2px solid #f5b301;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mm-tb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:1.45;margin:4px 0}
.mm-tb th,.mm-tb td{border:1px solid var(--ln);padding:6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.mm-tb th{background:var(--tint)}.mm-tb th small{display:block;color:var(--mu);font-weight:400}
.mm-tb col.c1{width:46%}.mm-tb col.c2{width:20%}.mm-tb col.c3{width:34%}
.mm-pop{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:600px;margin:0 auto;background:var(--cd);color:var(--fg);border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.mm-pop .w{font-size:24px;font-weight:800;overflow-wrap:anywhere}.mm-pop .m{font-size:14px;color:var(--mu)}
.mm-zh1{font-size:19px;font-weight:700;color:var(--ac);overflow-wrap:anywhere}
.mm-exp{font-size:16px;line-height:1.6;background:var(--tint);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.mm-ex{font-size:16px;line-height:1.6;overflow-wrap:anywhere}.mm-ex b{color:var(--ac)}.mm-ex .z{color:var(--mu);font-size:15px}
.mm-pop .row .b{padding:10px 6px;font-size:15px}
.mm-mini{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:600px;margin:0 auto;background:var(--ac);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:15px;border-radius:14px 14px 0 0}
.mm-mini span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mm-mini button{border:0;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;font-size:15px;font-weight:650;padding:8px 12px}
.mm-mini[hidden]{display:none}
#mmsr{width:100%;padding:12px;font-size:17px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--fg)}
.mm-vi{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.mm-vi .h1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.mm-vi .w{font-size:21px;font-weight:800;overflow-wrap:anywhere}.mm-vi .p{font-size:13px;color:var(--mu)}
.mm-vi .row .b{padding:9px 6px;font-size:14px}
.mm-fc{min-height:330px;cursor:pointer;text-align:center;align-items:center;justify-content:center;gap:8px;padding:18px 14px;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.mm-fc .w{font-size:32px;font-weight:800;overflow-wrap:anywhere;line-height:1.2}.mm-fc .p{font-size:14px;color:var(--mu)}
.mm-fc .ex{font-size:17px;line-height:1.65;text-align:left;overflow-wrap:anywhere;width:100%}.mm-fc .ex b{color:var(--ac)}
.mm-fc .hint{font-size:13px;color:var(--mu)}
.mm-fc.known{border-color:var(--ok)}
.mm-fc .bk{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.mm-prog{font-size:15px;text-align:center;color:var(--mu)}
.mm-fcb .b{padding:11px 4px;font-size:15px;flex:1 1 0}
.mm-fcb .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.mm-foot{font-size:13px;line-height:1.6}
@media(max-width:360px){.mm-en{font-size:19px}.mm-zh{font-size:17px}.mm-fc .w{font-size:28px}}

<p class="mu mm-foot">英文原文與朗讀音檔出自 Oaktree Capital, Howard Marks memo “A Layman Thinks About AI” (Nov 11, 2026)，僅供個人學習；中文為學習用途自行撰寫。</p>

<script>
(function(){
"use strict";
var M=window.MEMO,SEGS=window.MEMO_SEGS||[],B=M.blocks,V=M.vocab;
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
$("ttl").textContent="Howard Marks 備忘錄｜"+M.title;$("ten").textContent=M.en+"　・　"+M.date;

/* ---------- 單字比對 ---------- */
var reEsc=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")};
var alts=V.map(function(v,i){return{w:v.w.toLowerCase(),i:i}}).sort(function(a,b){return b.w.length-a.w.length});
var RX=new RegExp("(^|[^A-Za-z])("+alts.map(function(a){return reEsc(a.w)}).join("|")+")(?:s|es|d|ed|ing)?(?![A-Za-z])","gi");
function findV(t){t=t.toLowerCase();for(var k=0;k<alts.length;k++)if(t.indexOf(alts[k].w)===0)return alts[k].i;return -1}
function hl(s){var out="",last=0,m;RX.lastIndex=0;
 while((m=RX.exec(s))){var st=m.index+m[1].length,en=RX.lastIndex,i=findV(s.slice(st,en));
  out+=esc(s.slice(last,st));
  out+=i<0?esc(s.slice(st,en)):'<span class="mm-v" data-i="'+i+'">'+esc(s.slice(st,en))+"</span>";last=en}
 return out+esc(s.slice(last))}
function rich(t,vocab){var parts=String(t).split("**"),o="";parts.forEach(function(p,k){if(!p)return;var h=vocab?hl(p):esc(p);o+=k%2?"<b>"+h+"</b>":h});return o}
function boldW(ex,w){var i=ex.toLowerCase().indexOf(w.toLowerCase());if(i<0)return esc(ex);
 var j=i+w.length;while(j<ex.length&&/[A-Za-z]/.test(ex[j])&&j-i-w.length<3)j++;
 return esc(ex.slice(0,i))+"<b>"+esc(ex.slice(i,j))+"</b>"+esc(ex.slice(j))}

/* ---------- 音檔 ---------- */
var au=new Audio();au.preload="none";
var cur=null,rate=1,auto=false;
function fmt(d){if(!d||d<=0)return"";d=Math.round(d);return Math.floor(d/60)+":"+String(d%60).padStart(2,"0")}
function segOf(b){for(var i=0;i<SEGS.length;i++)if(SEGS[i].blocks.indexOf(b)>=0)return i;return -1}
function toast(m){var t=document.getElementById("mwtoast");if(!t){t=document.createElement("div");t.id="mwtoast";t.className="mw-toast";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},1800)}
function sync(){
 var playing=cur!==null&&!au.paused&&!au.ended;
 document.querySelectorAll(".mm-seg").forEach(function(el){var k=+el.dataset.k,on=k===cur;el.classList.toggle("on",on);
  var b=el.querySelector(".pl");if(b)b.textContent=on&&playing?"⏸ 暫停本段":(on&&!au.ended&&au.currentTime>0?"▶ 繼續播放":"▶ 播放本段（Howard Marks 原音）")});
 var mini=$("mmmini");mini.hidden=cur===null;
 if(cur!==null){$("mmmt").textContent="第 "+(cur+1)+" / "+SEGS.length+" 段";$("mmmp").textContent=playing?"⏸ 暫停":"▶ 播放"}
 document.querySelectorAll("[data-listen]").forEach(function(b){var k=segOf(+b.dataset.listen);b.textContent=(k===cur&&playing)?"⏸ 暫停":"🔊 聽原句"})}
function playSeg(k,scroll){
 var s=SEGS[k];if(!s)return;
 if(cur===k){if(au.paused||au.ended){if(au.ended)au.currentTime=0;au.play().catch(function(){})}else au.pause();sync();return}
 au.pause();cur=k;au.src=s.file;au.playbackRate=rate;au.defaultPlaybackRate=rate;
 var p=au.play();if(p&&p.catch)p.catch(function(){});
 sync();if(scroll){var el=$("seg-"+s.id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}}
function stopAll(){au.pause();try{au.removeAttribute("src");au.load()}catch(e){}cur=null;sync()}
au.addEventListener("play",sync);au.addEventListener("pause",sync);
au.addEventListener("ratechange",function(){});
au.addEventListener("error",function(){if(cur===null)return;toast("這段音檔還沒準備好");cur=null;sync()});
au.addEventListener("ended",function(){var k=cur;sync();if(auto&&k!==null&&k+1<SEGS.length){cur=null;playSeg(k+1,true)}else if(k!==null){cur=null;sync()}});
$("mmmp").onclick=function(){if(cur!==null)playSeg(cur)};$("mmms").onclick=stopAll;
$("mmrate").onclick=function(e){var b=e.target.closest("button[data-r]");if(!b)return;rate=+b.dataset.r;au.playbackRate=rate;au.defaultPlaybackRate=rate;
 this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)})};
$("mmauto").onchange=function(){auto=this.checked};
$("mmzt").onclick=function(){var t=$("mmtexts"),on=t.classList.toggle("showzh");this.textContent=on?"隱藏中譯":"顯示中譯"};

/* ---------- 課文 ---------- */
function blockHTML(i){var b=B[i],z=M.zh[i],n=M.notes&&M.notes[i],h="";
 if(b.kind==="table"){h='<table class="mm-tb"><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup><thead><tr>'+b.head.map(function(c,k){return"<th>"+esc(c)+"<small>"+esc(b.headEn[k])+"</small></th>"}).join("")+"</tr></thead><tbody>"+b.rows.map(function(r){return"<tr>"+r.map(function(c){return"<td>"+hl(c)+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table>"}
 else h='<p class="mm-en">'+rich(b.text,true)+"</p>";
 return'<div class="mm-b '+b.kind+'" id="b-'+i+'">'+h+'<p class="mm-zh">'+rich(z)+"</p>"+(n?'<div class="mm-note">💡 解說：'+esc(n)+"</div>":"")+"</div>"}
function renderTexts(){
 $("mmtexts").innerHTML=SEGS.map(function(s,k){
  return'<div class="mm-seg" id="seg-'+s.id+'" data-k="'+k+'"><div class="mm-sh"><button type="button" class="b p pl">▶ 播放本段（Howard Marks 原音）</button><span class="t">第 '+(k+1)+" / "+SEGS.length+" 段"+(fmt(s.dur)?"・"+fmt(s.dur):"")+"</span></div>"+s.blocks.map(blockHTML).join("")+"</div>"}).join("")}
$("mmtexts").addEventListener("click",function(e){
 var v=e.target.closest(".mm-v");if(v){openPop(+v.dataset.i);return}
 var p=e.target.closest(".pl");if(p){playSeg(+p.closest(".mm-seg").dataset.k)}});

/* ---------- 單字小卡 ---------- */
var pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
function mwHas(w){try{return window.MW&&MW.find(w)}catch(e){return false}}
function mwAdd(v,btn){try{if(!window.MW)return;MW.add({w:v.w,zh:v.zh,s:v.ex,l:"memo-ai",n:0,t:Date.now()});toast("已加入「"+v.w+"」到我的單字");if(btn)btn.textContent="⭐ 已加入"}catch(e){}}
function openPop(i){closePop();var v=V[i];pop=document.createElement("div");pop.className="mm-pop";
 pop.innerHTML='<div class="w">'+esc(v.w)+'</div><div class="m">'+esc(v.pos)+(v.ipa?"　"+esc(v.ipa):"")+'</div><div class="mm-zh1">'+esc(v.zh)+'</div><div class="mm-exp">'+esc(v.exp)+'</div><div class="mm-ex">'+boldW(v.ex,v.w)+'<div class="z">'+esc(v.exzh)+'</div></div><div class="row"><button type="button" class="b" data-a="l">🔊 聽原句</button><button type="button" class="b" data-a="m">'+(mwHas(v.w)?"⭐ 已加入":"⭐ 加入我的單字")+'</button><button type="button" class="b" data-a="x">關閉</button></div>';
 pop.onclick=function(e){var b=e.target.closest("button[data-a]");if(!b)return;var a=b.dataset.a;if(a==="x")closePop();else if(a==="l")listen(v.b);else if(a==="m"){if(!mwHas(v.w))mwAdd(v,b)}};
 document.body.appendChild(pop)}
document.addEventListener("click",function(e){if(pop&&!pop.contains(e.target)&&!e.target.closest(".mm-v"))closePop()});
function listen(b){var k=segOf(b);if(k<0){toast("找不到這段音檔");return}playSeg(k)}

/* ---------- 重點 ---------- */
function renderSummary(){var S=M.summary,qi=0,hIdx=[];B.forEach(function(b,i){if(b.kind==="h")hIdx.push(i)});
 var h='<div class="mm-card"><h2>📮 '+esc(M.title)+'</h2><div class="mm-meta">日期：2026 年 11 月 11 日<br>作者：Howard Marks（Oaktree Capital 共同創辦人）<br>原文：<a href="https://www.oaktreecapital.com/insights/memo/a-layman-thinks-about-ai" target="_blank" rel="noopener noreferrer">A Layman Thinks About AI（原文與官方 PDF）</a></div></div>';
 h+='<div class="mm-card"><h2>總結</h2>'+S.intro.map(function(t){return'<p class="mm-p0">'+esc(t)+"</p>"}).join("")+"</div>";
 h+='<div class="mm-card"><h2>11 個問題的重點</h2><div class="mu" style="font-size:13px">點開每一題看 Marks 的想法。</div>'+S.qs.map(function(q,k){
  return'<details class="mm-q"><summary><span class="qn">Question '+(k+1)+'</span><span class="qz">'+esc(q.qzh)+'</span><span class="qe">'+esc(q.q)+'</span></summary><div class="qb"><div>'+esc(q.pt)+'</div><button type="button" class="mm-link" data-go="'+hIdx[k]+'">看這一題的課文 →</button></div></details>'}).join("")+"</div>";
 h+='<div class="mm-card"><h2>'+esc(S.end.t)+'</h2><p class="mm-p0">'+esc(S.end.pt)+'</p><button type="button" class="mm-link" data-go="'+(B.length-4)+'">看結尾的課文 →</button></div>';
 $("sec-s").innerHTML=h}
$("sec-s").addEventListener("click",function(e){var g=e.target.closest("[data-go]");if(!g)return;show("t",false);var el=$("b-"+g.dataset.go);if(el)setTimeout(function(){el.scrollIntoView({block:"start"});window.scrollBy(0,-56)},30)});

/* ---------- 單字表 ---------- */
function renderVocab(){var q=$("mmsr").value.trim().toLowerCase();
 var arr=V.map(function(v,i){return i}).filter(function(i){var v=V[i];return!q||(v.w+" "+v.zh+" "+v.exp).toLowerCase().indexOf(q)>=0});
 $("mmvc").textContent="共 "+V.length+" 個"+(q?"，符合 "+arr.length+" 個":"");
 $("mmvl").innerHTML=arr.length?arr.map(function(i){var v=V[i];
  return'<div class="mm-vi"><div class="h1"><span class="w">'+esc(v.w)+'</span><span class="p">'+esc(v.pos)+(v.ipa?"　"+esc(v.ipa):"")+'</span></div><div class="mm-zh1">'+esc(v.zh)+'</div><div class="mm-exp">'+esc(v.exp)+'</div><div class="mm-ex">'+boldW(v.ex,v.w)+'<div class="z">'+esc(v.exzh)+'</div></div><div class="row"><button type="button" class="b" data-listen="'+v.b+'">🔊 聽原句</button><button type="button" class="b" data-mw="'+i+'">'+(mwHas(v.w)?"⭐ 已加入":"⭐ 加入我的單字")+'</button></div></div>'}).join(""):'<div class="mu">找不到符合的單字。</div>';
 sync()}
$("mmsr").oninput=renderVocab;
$("mmvl").addEventListener("click",function(e){var l=e.target.closest("[data-listen]");if(l){listen(+l.dataset.listen);return}
 var m=e.target.closest("[data-mw]");if(m){var v=V[+m.dataset.mw];if(!mwHas(v.w))mwAdd(v,m)}});

/* ---------- 單字卡 ---------- */
var KEY="invMemoAI1",mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&typeof o==="object")return o}}catch(e){}return mem||{known:{},only:false}}
function save(o){mem=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
var st=load();if(!st.known)st.known={};
var order=V.map(function(v,i){return i}),pos=0,flip=false;
function deck(){return order.filter(function(i){return!(st.only&&st.known[V[i].w])})}
function renderCard(){var d=deck(),nk=V.filter(function(v){return st.known[v.w]}).length;
 $("mmpg").textContent="已會 "+nk+" / "+V.length+(st.only?"　・　還剩 "+d.length+" 張":"　・　第 "+(d.length?Math.min(pos,d.length-1)+1:0)+" / "+d.length+" 張");
 $("mmonly").checked=!!st.only;
 var fc=$("mmfc");
 if(!d.length){fc.className="mm-card mm-fc";fc.innerHTML='<div class="w" style="font-size:26px">🎉 全部都會了</div><div class="hint">取消「只看還不會的」就能複習全部單字。</div>';return}
 if(pos>=d.length)pos=d.length-1;if(pos<0)pos=0;
 var v=V[d[pos]],known=!!st.known[v.w];fc.className="mm-card mm-fc"+(known?" known":"");
 fc.innerHTML=flip?
  '<div class="w">'+esc(v.w)+'</div><div class="p">'+esc(v.pos)+(v.ipa?"　"+esc(v.ipa):"")+(known?"　✔ 已會":"")+'</div><div class="bk"><div class="mm-zh1" style="text-align:center">'+esc(v.zh)+'</div><div class="mm-exp">'+esc(v.exp)+'</div><div class="ex">'+boldW(v.ex,v.w)+'<div class="mu" style="font-size:15px">'+esc(v.exzh)+'</div></div><div class="row"><button type="button" class="b" data-a="l">🔊 聽原句</button><button type="button" class="b" data-a="m">'+(mwHas(v.w)?"⭐ 已加入":"⭐ 加入我的單字")+'</button></div></div>'
  :'<div class="w">'+esc(v.w)+'</div><div class="p">'+esc(v.pos)+(known?"　✔ 已會":"")+'</div><div class="ex">'+boldW(v.ex,v.w)+'</div><div class="hint">點一下翻面，看中文與解說</div>'}
function go(n){var d=deck();if(!d.length)return;pos=(pos+n+d.length)%d.length;flip=false;renderCard()}
$("mmfc").addEventListener("click",function(e){var b=e.target.closest("button[data-a]");
 if(b){var d=deck(),v=V[d[pos]];if(b.dataset.a==="l")listen(v.b);else if(!mwHas(v.w)){mwAdd(v,b)}return}
 if(!deck().length)return;flip=!flip;renderCard()});
$("mmprev").onclick=function(){go(-1)};$("mmnext").onclick=function(){go(1)};
$("mmshuf").onclick=function(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=order[i];order[i]=order[j];order[j]=t}pos=0;flip=false;renderCard()};
function mark(k){var d=deck();if(!d.length)return;var v=V[d[pos]];if(k)st.known[v.w]=1;else delete st.known[v.w];save(st);
 flip=false;if(st.only&&k){renderCard()}else{pos=(pos+1)%Math.max(d.length,1);renderCard()}}
$("mmok").onclick=function(){mark(true)};$("mmre").onclick=function(){mark(false)};
$("mmonly").onchange=function(){st.only=this.checked;save(st);pos=0;flip=false;renderCard()};
(function(){var x0=null,y0=null,el=$("mmfc");
 el.addEventListener("touchstart",function(e){var t=e.changedTouches[0];x0=t.clientX;y0=t.clientY},{passive:true});
 el.addEventListener("touchend",function(e){if(x0===null)return;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();go(dx<0?1:-1);el._sw=Date.now()}},{passive:false});
 el.addEventListener("click",function(e){if(el._sw&&Date.now()-el._sw<400){e.stopImmediatePropagation();e.preventDefault()}},true)})();

/* ---------- 分頁 ---------- */
var ids=["s","t","v","c"],nav=$("jump");
function show(id,scroll){ids.forEach(function(s){var el=$("sec-"+s);if(el)el.hidden=s!==id});
 nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.sec===id)});
 closePop();if(id!=="t"&&id!=="v"&&id!=="c")stopAll();
 if(id==="v")renderVocab();if(id==="c")renderCard();if(scroll)window.scrollTo(0,0)}
nav.addEventListener("click",function(e){var b=e.target.closest("button[data-sec]");if(!b)return;history.replaceState(null,"","#"+b.dataset.sec);show(b.dataset.sec,true)});
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","");if(ids.indexOf(h)>=0)show(h,true)});
window.addEventListener("storage",function(e){if(e.key===null||e.key==="invMyWords1"){if(!$("sec-v").hidden)renderVocab()}});
renderSummary();renderTexts();renderVocab();renderCard();
var init=(location.hash||"").replace("#","");if(ids.indexOf(init)>=0)show(init,false);
})();
</script>
</body></html>
